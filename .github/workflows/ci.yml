name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Verify share safety
        if: matrix.node == 24
        run: npm run check:share

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Run tests and fixture evaluations
        run: npm run test:all

      - name: Audit dependencies
        if: matrix.node == 24
        run: npm audit --audit-level=high

      - name: Verify the package archive
        if: matrix.node == 24
        run: npm pack --dry-run --ignore-scripts

  fixture-browser:
    name: Node 24 fixture browser
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/neutral-saas/package-lock.json

      - name: Install CLI package metadata
        run: npm ci --ignore-scripts

      - name: Upgrade the checked-out v1 fixture
        run: node ./skills/wingmanpm-product-designer/bin/wingman-design.mjs upgrade --project fixtures/neutral-saas

      - name: Scaffold all table profiles
        run: |
          node ./skills/wingmanpm-product-designer/bin/wingman-design.mjs add data-table --project fixtures/neutral-saas --profile static --id ci-static-report
          node ./skills/wingmanpm-product-designer/bin/wingman-design.mjs add data-table --project fixtures/neutral-saas --profile work --id ci-work-items
          node ./skills/wingmanpm-product-designer/bin/wingman-design.mjs add data-table --project fixtures/neutral-saas --profile editable --id ci-editable-items

      - name: Install fixture dependencies
        working-directory: fixtures/neutral-saas
        run: npm ci --ignore-scripts

      - name: Install Chromium
        working-directory: fixtures/neutral-saas
        run: npx playwright install --with-deps chromium

      - name: Build fixture Storybook
        working-directory: fixtures/neutral-saas
        run: npm run build-storybook

      - name: Run one Chromium suite for all profiles
        working-directory: fixtures/neutral-saas
        env:
          WINGMAN_SKIP_SCREENSHOTS: '1'
        run: |
          npm run design:test:visual -- \
            tests/wingman-design/visual.spec.ts \
            tests/wingman-design/ci-static-report.spec.ts \
            tests/wingman-design/ci-work-items.spec.ts \
            tests/wingman-design/ci-editable-items.spec.ts

      - name: Verify machine-written browser evidence
        working-directory: fixtures/neutral-saas
        run: node ../../skills/wingmanpm-product-designer/bin/wingman-design.mjs check --project . --allow-pending-review

  showcase:
    name: Node 24 public showcase
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: showcase/package-lock.json

      - name: Install showcase dependencies
        run: npm --prefix showcase ci --ignore-scripts

      - name: Build and verify public showcase assets
        run: npm run test:showcase

  package-smoke:
    name: Package lifecycle (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
          - os: windows-latest
            node: 24

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Build npm archive without publishing
        id: pack
        shell: bash
        run: |
          npm pack --json --ignore-scripts > "$RUNNER_TEMP/npm-pack.json"
          node -e "const fs = require('node:fs'); const path = require('node:path'); const result = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-pack.json', 'utf8')); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tarball=' + path.resolve(result[0].filename) + '\n');"

      - name: Test packed install, upgrade, uninstall, and changed-file protection
        shell: bash
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: node ./scripts/smoke-packed-package.mjs "$TARBALL"
