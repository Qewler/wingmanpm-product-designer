name: Bug report
description: Report a reproducible problem with the skill, installer, or checks.
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove secrets, customer data, and private source before you submit.

  - type: input
    id: version
    attributes:
      label: Version
      description: Run `wingman-design --version`, or provide the Git tag or commit.
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Host and version, Node.js version, and operating system.
      placeholder: Codex; Node.js 24; macOS 15
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest safe prompt or command sequence that shows the problem.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched for an existing issue and removed private or sensitive data.
          required: true
