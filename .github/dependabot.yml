version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /fixtures/neutral-saas
    schedule:
      interval: weekly
      day: monday
      time: '08:05'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      fixture-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /showcase
    schedule:
      interval: weekly
      day: monday
      time: '08:10'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      showcase-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:15'
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
